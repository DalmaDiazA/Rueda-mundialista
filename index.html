<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Caja Sorpresa Mundialista - Chipax</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #00BA8F; --green2: #00d4a3;
    --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e; --surface3: #282828;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #f0f0f0; --text-muted: #666; --text-sub: #999;
    --radius: 20px; --radius-sm: 12px;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 1.25rem 1.5rem;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,186,143,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,186,143,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  #wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 860px;
    display: flex; flex-direction: column;
    gap: 14px;
  }

  /* HEADER */
  header { text-align: center; padding: 0 0 2px; }
  header h1 {
    font-size: 1.9rem; font-weight: 900;
    background: linear-gradient(135deg, var(--green), var(--green2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -1px;
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  header p { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }
  .brand {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 6px;
  }
  .brand-text { font-size: 1.1rem; font-weight: 900; color: var(--green); letter-spacing: -0.3px; }

  /* SORT BUTTON */
  #open-btn {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, var(--green), var(--green2));
    color: white; border: none; border-radius: var(--radius);
    font-size: 1.05rem; font-weight: 700; cursor: pointer;
    letter-spacing: 0.3px;
    box-shadow: 0 0 40px rgba(0,186,143,0.2);
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  #open-btn:hover:not(:disabled) {
    opacity: 0.92; transform: translateY(-2px);
    box-shadow: 0 0 60px rgba(0,186,143,0.35);
  }
  #open-btn:active:not(:disabled) { transform: translateY(0); }
  #open-btn:disabled {
    background: var(--surface2); color: var(--text-muted);
    cursor: default; box-shadow: none; transform: none;
  }

  /* SLOT */
  #slot-area {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 2rem;
    text-align: center;
  }
  #slot-area.show { display: block; }
  #slot-label {
    font-size: 0.7rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.12em;
    margin-bottom: 14px;
  }
  #slot-window {
    overflow: hidden; height: 64px;
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    max-width: 360px; margin: 0 auto;
  }
  #slot-reel { display: flex; flex-direction: column; align-items: center; }
  .slot-item {
    height: 64px; display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 700; color: var(--text); min-width: 260px;
  }
  #slot-winner {
    display: none;
    font-size: 2.8rem; font-weight: 900;
    background: linear-gradient(135deg, var(--green), var(--green2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    padding: 4px 0; line-height: 1.1;
  }
  #slot-winner.show { display: block; }
  #slot-sub { display: none; font-size: 0.9rem; color: var(--text-sub); margin-top: 8px; }
  #slot-sub.show { display: block; }

  /* PITCH (CANCHA) */
  #pitch-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 12px;
  }
  #pitch-title {
    text-align: center; font-size: 0.7rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 6px;
  }
  .pitch-visual {
    position: relative;
    width: 100%; max-width: 460px; height: clamp(260px, 46vh, 420px);
    margin: 0 auto;
    border-radius: 14px;
    overflow: hidden;
    background: radial-gradient(ellipse at 15% 0%, rgba(255,255,255,0.18), transparent 40%),
                radial-gradient(ellipse at 85% 0%, rgba(255,255,255,0.18), transparent 40%),
                linear-gradient(180deg, #0b0f18 0%, #1a2433 45%, #0b0f18 100%);
  }
  .pitch-visual.big { max-width: 480px; height: clamp(280px, 50vh, 440px); }
  .pitch-visual .grass {
    position: absolute; left: 50%; top: 8%; width: 92%; height: 90%;
    transform: translateX(-50%);
    clip-path: polygon(18% 0%, 82% 0%, 100% 100%, 0% 100%);
    background: repeating-linear-gradient(0deg, #1e8a54 0px, #1e8a54 34px, #1a7a4a 34px, #1a7a4a 68px);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.45);
  }
  .pitch-visual .grass::before {
    content: ''; position: absolute; left: 0; right: 0; top: 46%;
    height: 2px; background: rgba(255,255,255,0.5);
  }
  .pitch-visual .grass::after {
    content: ''; position: absolute; left: 50%; top: 46%;
    width: 70px; height: 70px; margin: -35px 0 0 -35px;
    border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
  }
  .pitch-box {
    position: absolute; left: 50%; width: 130px; height: 46px;
    margin-left: -65px; border: 2px solid rgba(255,255,255,0.5); z-index: 1;
  }
  .pitch-box.top { top: 8%; border-top: none; }
  .pitch-box.bottom { bottom: 2%; border-bottom: none; }

  .player-slot {
    position: absolute; left: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 0;
    width: 100px; text-align: center; z-index: 2;
  }
  .avatar {
    position: relative; width: 54px; height: 54px; border-radius: 50%;
    background: #2a2a2a; border: 4px dashed rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; overflow: hidden; transition: transform 0.3s, border-color 0.3s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }
  .player-slot.filled .avatar {
    border: 4px solid white; background: #444;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-fallback {
    width: 100%; height: 100%; display: none;
    align-items: center; justify-content: center;
    font-weight: 900; font-size: 1.5rem; color: white; background: var(--surface3);
  }
  .player-role {
    font-size: 0.6rem; color: rgba(255,255,255,0.7);
    text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7); margin-top: 2px;
  }
  .player-name {
    font-size: 0.68rem; font-weight: 800; color: white;
    text-transform: uppercase; letter-spacing: 0.02em;
    background: rgba(0,0,0,0.82);
    padding: 3px 8px; border-radius: 4px;
    max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 4px;
  }
  .player-slot.pending .avatar {
    border-color: var(--green2); animation: pulseSlot 1s ease-in-out infinite;
  }
  @keyframes pulseSlot { 0%,100%{box-shadow:0 0 0 0 rgba(0,212,163,0.5)} 50%{box-shadow:0 0 0 10px rgba(0,212,163,0)} }
  .player-slot.pop-in { animation: popIn 0.45s ease; }
  @keyframes popIn { 0%{transform:translate(-50%,-50%) scale(0.3); opacity:0} 60%{transform:translate(-50%,-50%) scale(1.15)} 100%{transform:translate(-50%,-50%) scale(1); opacity:1} }

  #bench-row {
    max-width: 460px; margin: 10px auto 0; display: flex;
    align-items: center; justify-content: center; gap: 14px;
    padding: 8px 14px; background: var(--surface2);
    border: 1px dashed var(--border2); border-radius: var(--radius-sm);
  }
  #bench-row .player-slot { position: static; transform: none; }
  #bench-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }

  /* BOXES */
  #boxes-title {
    text-align: center; font-size: 0.7rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.12em; margin: 0 0 2px;
  }
  #boxes-area { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .box-wrap {
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer; padding: 10px 6px 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); transition: border-color 0.2s, background 0.2s;
  }
  .box-wrap:not(.opened):not(.disabled):hover { border-color: var(--border2); background: var(--surface2); }
  .box-wrap.disabled { cursor: default; pointer-events: none; }
  .box-3d { width: 68px; height: 68px; transition: opacity 0.3s, filter 0.2s; }
  .ball-spin { width: 100%; height: 100%; display: flex; }
  .box-wrap:not(.opened):not(.disabled) .ball-spin { animation: spinball 3s linear infinite; }
  .box-wrap:nth-child(2):not(.opened):not(.disabled) .ball-spin { animation-duration: 3.4s; }
  .box-wrap:nth-child(3):not(.opened):not(.disabled) .ball-spin { animation-duration: 2.7s; }
  .box-wrap:nth-child(4):not(.opened):not(.disabled) .ball-spin { animation-duration: 3.6s; }
  .box-wrap:nth-child(5):not(.opened):not(.disabled) .ball-spin { animation-duration: 3.1s; }
  .box-wrap:not(.opened):not(.disabled):hover .ball-spin { animation-duration: 0.7s; }
  @keyframes spinball { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  .box-wrap:not(.opened):not(.disabled) .box-3d { animation: float 2.4s ease-in-out infinite; }
  .box-wrap:nth-child(2):not(.opened):not(.disabled) .box-3d { animation-delay: 0.3s; }
  .box-wrap:nth-child(3):not(.opened):not(.disabled) .box-3d { animation-delay: 0.6s; }
  .box-wrap:nth-child(4):not(.opened):not(.disabled) .box-3d { animation-delay: 0.9s; }
  .box-wrap:nth-child(5):not(.opened):not(.disabled) .box-3d { animation-delay: 1.2s; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .box-wrap:not(.opened):not(.disabled):hover .box-3d {
    animation: none; transform: translateY(-6px) scale(1.06);
    transition: transform 0.15s; filter: brightness(1.2);
  }
  .box-wrap.opened .box-3d { opacity: 0.25; }
  .box-wrap.disabled:not(.opened) .box-3d { opacity: 0.12; }
  .box-wrap.pop .box-3d { animation: pop 0.5s ease !important; }
  @keyframes pop { 0%{transform:scale(1) rotate(0)} 25%{transform:scale(1.3) rotate(-8deg)} 50%{transform:scale(0.9) rotate(5deg)} 75%{transform:scale(1.1) rotate(-3deg)} 100%{transform:scale(1) rotate(0)} }
  .box-num { font-size: 10px; color: var(--text-muted); margin-top: 6px; font-weight: 500; letter-spacing: 0.04em; }
  .box-wrap.opened .box-num { color: var(--green); }

  /* REVEAL */
  #reveal-area {
    display: none; background: var(--surface); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 1.25rem; text-align: center;
    animation: fadeUp 0.35s ease;
  }
  #reveal-area.show { display: block; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  #reveal-title {
    font-size: 1.6rem; font-weight: 900;
    background: linear-gradient(135deg, var(--green), var(--green2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px; letter-spacing: -0.5px;
  }
  #reveal-text {
    font-size: 0.95rem; font-weight: 500; color: var(--text-sub);
    line-height: 1.4; max-width: 480px; margin: 0 auto 12px;
  }
  #name-form { display: flex; gap: 10px; max-width: 420px; margin: 0 auto; }
  #name-input {
    flex: 1; padding: 11px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--border2); background: var(--surface2);
    color: var(--text); font-size: 1rem; font-family: 'Inter', sans-serif;
  }
  #name-input:focus { outline: none; border-color: var(--green); }
  #btn-add {
    padding: 11px 20px; border-radius: var(--radius-sm); border: none;
    background: linear-gradient(135deg, var(--green), var(--green2));
    color: white; font-weight: 700; cursor: pointer; font-size: 0.95rem;
    box-shadow: 0 0 24px rgba(0,186,143,0.25); transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  #btn-add:hover { opacity: 0.88; transform: translateY(-1px); }
  #btn-add:disabled { opacity: 0.4; cursor: default; transform: none; }

  /* NEXT */
  #next-btn {
    display: none; width: 100%; padding: 12px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: var(--radius); font-size: 1rem; color: var(--text);
    cursor: pointer; font-weight: 600; transition: background 0.15s, transform 0.1s;
  }
  #next-btn:hover { background: var(--surface3); transform: translateY(-1px); }
  #next-btn.show { display: block; }

  #champion-overlay {
    display: none; position: fixed; inset: 0; z-index: 2000;
    background: #050505; overflow: hidden;
    align-items: center; justify-content: center;
    padding: 2.5rem 1.5rem;
    animation: fadeIn 0.35s ease;
  }
  #champion-overlay.show { display: flex; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  #champion-bg-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; display: none;
  }
  #champion-tint {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(5,5,5,0.55) 0%, rgba(5,5,5,0.82) 60%, rgba(5,5,5,0.92) 100%);
  }
  #champion-inner { position: relative; z-index: 2; width: 100%; max-width: 560px; text-align: center; margin: auto; max-height: 100%; overflow-y: auto; }
  #champion-title {
    font-size: 1.8rem; font-weight: 900; margin-bottom: 20px;
    background: linear-gradient(135deg, var(--green), var(--green2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #champion-bench-row {
    max-width: 520px; margin: 16px auto 0; display: flex;
    align-items: center; justify-content: center; gap: 14px;
    padding: 10px 16px; background: var(--surface2);
    border: 1px dashed var(--border2); border-radius: var(--radius-sm);
  }
  #champion-bench-row .player-slot { position: static; transform: none; }
  #champion-close-btn {
    margin-top: 26px; padding: 15px 36px; border: none; border-radius: var(--radius);
    background: linear-gradient(135deg, var(--green), var(--green2));
    color: white; font-weight: 700; font-size: 1rem; cursor: pointer;
    box-shadow: 0 0 30px rgba(0,186,143,0.3); transition: opacity 0.15s, transform 0.1s;
  }
  #champion-close-btn:hover { opacity: 0.88; transform: translateY(-1px); }  @media (max-height: 720px) {
    body { padding: 0.75rem 1.25rem; }
    #wrap { gap: 10px; }
    header h1 { font-size: 1.5rem; }
    .pitch-visual { height: clamp(220px, 42vh, 340px); }
    .avatar { width: 44px; height: 44px; font-size: 1.1rem; }
    .box-3d { width: 54px; height: 54px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 417 418" xmlns="http://www.w3.org/2000/svg">
        <path d="M249.849 98.2612L208.5 139.61L167.152 98.2612L60.9131 204.5L167.152 310.739L208.5 269.391L249.849 310.739L356.088 204.5L249.849 98.2612ZM249.849 112.452L336.888 199.491H268.382L215.592 146.701L249.849 112.452ZM201.401 146.701L148.611 199.491H80.113L167.152 112.452L201.401 146.701ZM167.152 296.548L80.113 209.509H148.611L201.401 262.299L167.152 296.548ZM208.5 255.2L157.801 204.5L208.5 153.801L259.2 204.5L208.5 255.2ZM249.841 296.548L215.592 262.299L268.382 209.509H336.88L249.841 296.548Z" fill="#00BA8F"/>
      </svg>
      <span class="brand-text">Chipax</span>
    </div>
    <h1>Alineación Mundialista</h1>
    <p>Sortea un chipaxiano, elige una pelota y arma la alineación entre todo el equipo.</p>
  </header>

  <button id="open-btn" onclick="startSpin()">¡Sortear chipaxiano! ⚽</button>

  <div id="slot-area">
    <div id="slot-label">Le toca a...</div>
    <div id="slot-window"><div id="slot-reel"></div></div>
    <div id="slot-winner"></div>
    <div id="slot-sub">Elige una pelota 👇</div>
  </div>

  <div id="pitch-card">
    <div id="pitch-title">Alineación Chipax</div>
    <div id="pitch" class="pitch-visual"></div>
    <div id="bench-row">
      <span id="bench-label">Banca técnica:</span>
      <div id="bench-slot-container"></div>
    </div>
  </div>

  <div id="boxes-title">Elige una pelota para revelar la posición</div>
  <div id="boxes-area"></div>

  <div id="reveal-area">
    <div id="reveal-title"></div>
    <div id="reveal-text"></div>
    <div id="name-form">
      <input id="name-input" type="text" placeholder="Escribe el nombre elegido..." autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault(); addToPitch();}"/>
      <button id="btn-add" type="button" onclick="addToPitch()">Agregar a la cancha ⚽</button>
    </div>
  </div>

  <button id="next-btn" onclick="nextRound()">Siguiente sorteo →</button>
</div>

<div id="champion-overlay">
  <video id="champion-bg-video" muted loop playsinline preload="none"></video>
  <div id="champion-tint"></div>
  <div id="champion-inner">
    <div id="champion-title">🏆 ¡Alineación Chipax Completa!</div>
    <div id="champion-pitch" class="pitch-visual big"></div>
    <div id="champion-bench-row">
      <span id="bench-label">Banca técnica:</span>
      <div id="champion-bench-container"></div>
    </div>
    <button id="champion-close-btn" onclick="closeChampion()">Nueva ronda ⚽</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
// 👉 EDITA ESTA LÍNEA: pega aquí la URL base de tu repo de GitHub donde subiste las fotos.
// Ejemplo: "https://raw.githubusercontent.com/tu-usuario/tu-repo/main/fotos/"
// Si la dejas vacía (""), busca las fotos en la misma carpeta donde abras este HTML.
const IMG_BASE_URL = "";

// 👉 EDITA ESTA LÍNEA: nombre o URL del video de fondo para la pantalla de celebración.
// Si subes el archivo junto al index.html en el mismo repo, basta con el nombre (ej. "download.mp4").
// Déjalo vacío ("") si no quieres video de fondo.
const VIDEO_URL = "download.mp4";

const CHIPAXIANOS = ["Ado","Alexis","Barbi","Carla","Cami","Claudio","Dal","Dani","Dibu","Eric","Francois","Frano","Graci","Gracia","Jake","Javi","Javi G","JC","Jesu","Jhoa","Juan Cruz","Kiari","Maripi","Maripa","Mirwing","Nico","Pablo","PabloT","Pipe", "Panchi","Romi","Sofi","Tito","Toni","Turbo","Yordana"];

// Posiciones fijas de la alineación. index 0-3 van en la cancha, index 4 es la banca (Entrenador).
const POSITIONS = [
  { icon:"🧤", name:"Arquero", top:"90%", desc:"Elige a un chipaxiano de cualquier equipo que sea \"el arquero\" de Chipax: quien siempre aparece para salvar el día cuando algo se complica." },
  { icon:"🛡️", name:"Defensor", top:"68%", desc:"Elige a un chipaxiano de cualquier equipo que sea \"el defensor\": quien protege al equipo, cuida los detalles y no deja pasar ni un error." },
  { icon:"🎯", name:"Mediocampista", top:"40%", desc:"Elige a un chipaxiano de cualquier equipo que sea \"el mediocampista\": quien conecta a todos y hace que todo fluya entre áreas." },
  { icon:"⚡", name:"Delantero", top:"12%", desc:"Elige a un chipaxiano de cualquier equipo que sea \"el delantero\": quien cierra los proyectos, mete los goles y saca los resultados." },
  { icon:"📋", name:"Entrenador (DT)", top:null, desc:"Elige a un chipaxiano de cualquier equipo que sea \"el entrenador\": quien guía, da la estrategia y saca lo mejor de los demás." }
];

const BOX_COLORS = [
  { border:'#FFD700' },
  { border:'#4ADE80' },
  { border:'#93C5FD' },
  { border:'#F5A623' },
  { border:'#F9A8D4' },
];

function cleanName(name) {
  return name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
}

// Prueba varias extensiones de imagen en orden hasta encontrar la foto, o cae al avatar con inicial.
const PHOTO_EXTS = ['jpeg','jpg','png','JPG','JPEG','PNG'];
function tryNextExt(img, base, clean, idx) {
  if (idx >= PHOTO_EXTS.length) {
    img.style.display = 'none';
    img.nextElementSibling.style.display = 'flex';
    return;
  }
  img.onerror = function () { tryNextExt(img, base, clean, idx + 1); };
  img.src = base + clean + '.' + PHOTO_EXTS[idx];
}

function makeBallSVG(c, opened) {
  const cx = 50, cy = 50, R = 44;
  const uid = c.border.replace('#', '');
  return `<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="halo-${uid}" cx="50%" cy="50%" r="60%">
        <stop offset="55%" stop-color="${c.border}" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="${c.border}" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="shade-${uid}" cx="32%" cy="28%" r="80%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="70%" stop-color="#f4f4f4"/>
        <stop offset="100%" stop-color="#c9c9c9"/>
      </radialGradient>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="48" fill="url(#halo-${uid})"/>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#shade-${uid})" stroke="#111" stroke-width="1.5"/>
    <text x="${cx}" y="${cy + 2}" font-size="62" text-anchor="middle" dominant-baseline="middle">⚽</text>
    ${opened ? `<circle cx="82" cy="18" r="14" fill="${c.border}"/><text x="82" y="23" font-size="15" text-anchor="middle" fill="#111" font-weight="900">✓</text>` : ''}
  </svg>`;
}

let boxes=[], usedPositions=[], openedBox=null, currentWinner=null, roundDone=false, spinning=false;
let team = new Array(5).fill(null); // {name} por índice de POSITIONS
let pendingIndex = null, pendingBoxId = null;

function buildBoxes() {
  boxes = BOX_COLORS.map((c,i) => ({id:i,c,opened:false}));
  usedPositions = [];
  team = new Array(5).fill(null);
  renderBoxes();
  renderPitch();
}

function renderBoxes() {
  const area = document.getElementById('boxes-area');
  area.innerHTML = '';
  const locked = openedBox!==null || !currentWinner || spinning;
  boxes.forEach(b => {
    const wrap = document.createElement('div');
    wrap.className = 'box-wrap'+(b.opened?' opened disabled':(locked?' disabled':''));
    wrap.id = `bw-${b.id}`;
    const inner = document.createElement('div');
    inner.className = 'box-3d';
    inner.innerHTML = `<div class="ball-spin">${makeBallSVG(b.c, b.opened)}</div>`;
    wrap.appendChild(inner);
    const lbl = document.createElement('div');
    lbl.className = 'box-num';
    lbl.textContent = b.opened ? '✓' : 'Pelota '+(b.id+1);
    wrap.appendChild(lbl);
    if (!b.opened && !locked) wrap.onclick = () => openBox(b.id);
    area.appendChild(wrap);
  });
}

function playerSlotHTML(idx, isPending) {
  const pos = POSITIONS[idx];
  const filled = team[idx];
  const cls = 'player-slot' + (filled ? ' filled' : '') + (isPending ? ' pending' : '');
  let avatarInner;
  if (filled) {
    const clean = cleanName(filled.name);
    const initial = filled.name.trim().charAt(0).toUpperCase();
    avatarInner = `<img src="${IMG_BASE_URL}${clean}.${PHOTO_EXTS[0]}" alt="${filled.name}" onerror="tryNextExt(this, '${IMG_BASE_URL}', '${clean}', 1)">
      <div class="avatar-fallback">${initial}</div>`;
  } else {
    avatarInner = pos.icon;
  }
  return `<div class="${cls}" id="pslot-${idx}" style="${pos.top!==null ? `top:${pos.top};` : ''}">
    <div class="avatar">${avatarInner}</div>
    <div class="player-name">${filled ? filled.name : '&nbsp;'}</div>
    <div class="player-role">${pos.icon} ${pos.name}</div>
  </div>`;
}

function buildPitchMarkup(highlightIdx) {
  return `
    <div class="grass"></div>
    <div class="pitch-box top"></div>
    <div class="pitch-box bottom"></div>
  ` + [0,1,2,3].map(i => playerSlotHTML(i, i===highlightIdx)).join('');
}

function renderPitch() {
  document.getElementById('pitch').innerHTML = buildPitchMarkup(pendingIndex);
  document.getElementById('bench-slot-container').innerHTML = playerSlotHTML(4, 4===pendingIndex);
}

function renderChampionPitch() {
  document.getElementById('champion-pitch').innerHTML = buildPitchMarkup(null);
  document.getElementById('champion-bench-container').innerHTML = playerSlotHTML(4, false);
}

function showChampionOverlay() {
  renderChampionPitch();
  document.getElementById('champion-overlay').classList.add('show');
  const vid = document.getElementById('champion-bg-video');
  if (VIDEO_URL) {
    if (vid.getAttribute('src') !== VIDEO_URL) vid.setAttribute('src', VIDEO_URL);
    vid.style.display = 'block';
    vid.currentTime = 0;
    vid.play().catch(() => {});
  } else {
    vid.style.display = 'none';
  }
  if (typeof confetti!=='undefined') {
    confetti({particleCount:200,spread:100,origin:{y:0.4},colors:['#FFD700','#00BA8F','#93C5FD','#F5A623','#75AADB']});
    setTimeout(()=>confetti({particleCount:130,spread:110,origin:{x:0.15,y:0.5},colors:['#FFD700','#00BA8F','#93C5FD']}),300);
    setTimeout(()=>confetti({particleCount:130,spread:110,origin:{x:0.85,y:0.5},colors:['#FFD700','#00BA8F','#93C5FD']}),500);
  }
}

function closeChampion() {
  document.getElementById('champion-overlay').classList.remove('show');
  const vid = document.getElementById('champion-bg-video');
  vid.pause();
  openedBox=null; currentWinner=null; roundDone=false; spinning=false;
  document.getElementById('next-btn').classList.remove('show');
  document.getElementById('reveal-area').classList.remove('show');
  document.getElementById('slot-area').classList.remove('show');
  document.getElementById('slot-winner').className='';
  document.getElementById('slot-sub').className='';
  document.getElementById('slot-window').style.display='flex';
  document.getElementById('open-btn').disabled=false;
  buildBoxes();
}

function startSpin() {
  if (spinning) return;
  spinning=true; currentWinner=null; openedBox=null; roundDone=false;
  document.getElementById('reveal-area').classList.remove('show');
  document.getElementById('next-btn').classList.remove('show');
  document.getElementById('open-btn').disabled=true;
  const slotWindow = document.getElementById('slot-window');
  const slotWinner = document.getElementById('slot-winner');
  const slotSub = document.getElementById('slot-sub');
  const lbl = document.getElementById('slot-label');
  slotWindow.style.display='flex';
  slotWinner.className=''; slotSub.className='';
  lbl.textContent='Le toca a...';
  const target = CHIPAXIANOS[Math.floor(Math.random()*CHIPAXIANOS.length)];
  const reel = document.getElementById('slot-reel');
  document.getElementById('slot-area').classList.add('show');
  const items=[];
  for (let i=0;i<28;i++) items.push(CHIPAXIANOS[Math.floor(Math.random()*CHIPAXIANOS.length)]);
  items.push(target);
  reel.innerHTML=items.map(n=>`<div class="slot-item">${n}</div>`).join('');
  reel.style.transition='none'; reel.style.transform='translateY(0)';
  let idx=0; const itemH=64; const total=items.length;
  function step() {
    if (idx>=total-1) {
      reel.style.transition='transform 0.4s cubic-bezier(0.15,0,0.3,1)';
      reel.style.transform=`translateY(-${(total-1)*itemH}px)`;
      setTimeout(() => {
        spinning=false; currentWinner=target;
        slotWindow.style.display='none';
        lbl.textContent='¡Le toca a...';
        slotWinner.textContent=target;
        slotWinner.className='show';
        slotSub.className='show';
        renderBoxes();
        if (typeof confetti!=='undefined') confetti({particleCount:100,spread:65,origin:{y:0.4},colors:['#00BA8F','#FDE68A','#B59DFB']});
      }, 420);
      return;
    }
    const progress=idx/(total-2);
    const delay=38+progress*progress*160;
    reel.style.transition=`transform ${delay}ms linear`;
    reel.style.transform=`translateY(-${idx*itemH}px)`;
    idx++;
    setTimeout(step, delay+10);
  }
  setTimeout(step, 80);
}

function openBox(id) {
  if (openedBox!==null||!currentWinner||spinning) return;
  openedBox=id; boxes[id].opened=true;
  const pool = POSITIONS.map((_,i)=>i).filter(i=>!usedPositions.includes(i));
  const qi = pool[Math.floor(Math.random()*pool.length)];
  usedPositions.push(qi);
  pendingIndex = qi; pendingBoxId = id;
  renderBoxes();
  renderPitch();
  const wrap=document.getElementById(`bw-${id}`);
  if (wrap){ const b3=wrap.querySelector('.box-3d'); if(b3){b3.classList.add('pop');setTimeout(()=>b3.classList.remove('pop'),500);} }
  const pos = POSITIONS[qi];
  document.getElementById('reveal-title').textContent = `${pos.icon} ${pos.name}`;
  document.getElementById('reveal-text').textContent = `${pos.desc} Escribe abajo el nombre que ${currentWinner} elige.`;
  document.getElementById('name-input').value = '';
  document.getElementById('reveal-area').classList.add('show');
  setTimeout(() => document.getElementById('name-input').focus(), 300);
  roundDone=false; document.getElementById('next-btn').classList.remove('show');
  if (typeof confetti!=='undefined') confetti({particleCount:120,spread:75,origin:{y:0.55},colors:['#FFD700','#00BA8F','#93C5FD','#F5A623']});
}

function addToPitch() {
  const input = document.getElementById('name-input');
  const name = input.value.trim();
  if (!name || pendingIndex===null) return;
  team[pendingIndex] = { name };
  const filledIdx = pendingIndex;
  pendingIndex = null; pendingBoxId = null;
  renderPitch();
  const el = document.getElementById(`pslot-${filledIdx}`);
  if (el) { el.classList.add('pop-in'); setTimeout(()=>el.classList.remove('pop-in'), 500); }
  document.getElementById('reveal-area').classList.remove('show');

  if (team.every(t => t !== null)) {
    setTimeout(showChampionOverlay, 450);
    return;
  }

  roundDone = true;
  document.getElementById('next-btn').classList.add('show');
  if (typeof confetti!=='undefined') confetti({particleCount:160,spread:85,origin:{y:0.5},colors:['#00BA8F','#FDE68A','#75AADB','#ffffff']});
}

function nextRound() {
  openedBox=null; currentWinner=null; roundDone=false; spinning=false;
  document.getElementById('next-btn').classList.remove('show');
  document.getElementById('reveal-area').classList.remove('show');
  document.getElementById('slot-area').classList.remove('show');
  document.getElementById('slot-winner').className='';
  document.getElementById('slot-sub').className='';
  document.getElementById('slot-window').style.display='flex';
  document.getElementById('open-btn').disabled=false;
  renderBoxes();
}
buildBoxes();
</script>
</body>
</html>
